server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # WAJIB untuk React Router agar refresh page tidak 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache untuk assets (JS, CSS, gambar, manifest)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Tidak cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}