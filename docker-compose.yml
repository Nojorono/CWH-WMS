version: '3.8'

services:
  frontend-wms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_ENDPOINT=${VITE_API_ENDPOINT:-http://localhost:9004}
        - VITE_S3_ENDPOINT=${VITE_S3_ENDPOINT:-}
    image: frontend-wms:latest
    container_name: frontend-wms
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - wms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  wms-network:
    driver: bridge

